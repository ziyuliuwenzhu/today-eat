<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffaf4">
  <title>今天吃什么</title>
  <style>
    :root{--ink:#211f1b;--muted:#716d65;--paper:#fffaf4;--panel:#fff;--line:#ded8cf;--red:#dd4b32;--red2:#b82f22;--green:#25745b;--yellow:#f1c75b;--shadow:0 18px 50px rgba(69,48,30,.12)}
    *{box-sizing:border-box}html{background:var(--paper);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,rgba(241,199,91,.18),transparent 28%),linear-gradient(180deg,#fffaf4,#f7f2eb)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 360px}.main{padding:clamp(22px,4vw,56px);display:flex;flex-direction:column}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px}.mark{width:38px;height:38px;border-radius:10px;background:var(--red);display:grid;place-items:center;color:#fff;font-size:21px;box-shadow:0 7px 16px rgba(221,75,50,.25)}.ghost{border:1px solid var(--line);background:rgba(255,255,255,.64);height:40px;padding:0 14px;border-radius:7px;color:var(--ink);font-weight:650}.hero{width:min(720px,100%);margin:auto;text-align:center;padding:40px 0}.eyebrow{font-size:13px;color:var(--red2);font-weight:800;letter-spacing:.12em}.hero h1{font-size:clamp(38px,7vw,72px);line-height:1.05;margin:15px 0 12px;letter-spacing:0}.sub{color:var(--muted);font-size:16px;margin:0 auto 30px}.draw-box{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:clamp(22px,4vw,40px);position:relative;overflow:hidden}.draw-box:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--red) 50%,var(--yellow) 50%)}.result-label{font-size:13px;color:var(--muted);font-weight:700}.result{min-height:84px;display:grid;place-items:center;font-size:clamp(34px,6vw,58px);font-weight:900;margin:4px 0 10px;word-break:break-word;line-height:1.15}.result.rolling{color:var(--red);animation:pulse .16s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.025);opacity:.68}}.result-meta{height:24px;color:var(--muted);font-size:13px}.draw-btn{width:100%;height:60px;border:0;border-radius:7px;color:#fff;background:var(--red);font-weight:850;font-size:18px;box-shadow:0 8px 0 var(--red2);transition:.15s transform,.15s box-shadow;margin-top:20px}.draw-btn:hover{background:#e2553c}.draw-btn:active{transform:translateY(5px);box-shadow:0 3px 0 var(--red2)}.draw-btn:disabled{opacity:.55;cursor:not-allowed}.hint{margin-top:18px;color:var(--muted);font-size:12px}.sidebar{border-left:1px solid var(--line);background:rgba(255,255,255,.76);padding:28px 24px;display:flex;flex-direction:column;min-height:100vh}.side-title{font-size:20px;font-weight:850;margin:2px 0}.side-desc{font-size:13px;color:var(--muted);margin:4px 0 18px}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:12px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:99px;font-size:12px;font-weight:700}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}.food-list{display:flex;flex-direction:column;gap:7px;overflow:auto;flex:1;max-height:calc(100vh - 255px);padding-right:2px}.food{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:11px 12px;border:1px solid #ebe6df;background:#fff;border-radius:7px}.food-name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis}.tag{font-size:10px;color:var(--green);background:#e8f3ed;border-radius:3px;padding:3px 5px}.del{border:0;background:transparent;color:#9a958d;font-size:18px;padding:0 2px;line-height:1}.del:hover{color:var(--red)}.food-right{display:flex;align-items:center;gap:7px}.empty{padding:35px 14px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:7px}.add{display:flex;gap:8px;margin-top:14px}.add input{width:100%;border:1px solid var(--line);background:#fff;border-radius:7px;padding:11px 12px;outline:none}.add input:focus,textarea:focus,select:focus{border-color:var(--red)}.icon-btn{width:43px;flex:0 0 43px;border:0;border-radius:7px;background:var(--ink);color:white;font-size:22px}.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.side-actions button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px;font-weight:700;font-size:12px}.backdrop{position:fixed;inset:0;background:rgba(29,25,20,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.backdrop.open{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:8px;padding:24px;box-shadow:0 30px 90px rgba(0,0,0,.28)}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{font-size:22px;margin:0}.close{border:0;background:transparent;font-size:26px}.modal p{color:var(--muted);font-size:13px}.modal textarea{width:100%;min-height:210px;resize:vertical;border:1px solid var(--line);border-radius:7px;padding:12px;outline:none;line-height:1.7}.modal-row{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:12px}.modal select{border:1px solid var(--line);border-radius:7px;padding:0 10px;background:#fff}.primary{border:0;background:var(--red);color:#fff;border-radius:7px;padding:12px 18px;font-weight:800}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:6px;padding:10px 15px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:850px){.app{display:block}.main{min-height:72vh;padding-bottom:32px}.hero{margin:30px auto 0;padding:25px 0}.sidebar{min-height:auto;border-left:0;border-top:1px solid var(--line);padding:22px 18px}.food-list{max-height:380px}.topbar .ghost{display:none}.draw-box{padding:28px 18px}.result{min-height:74px}.modal-row{grid-template-columns:1fr}.modal select{height:42px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    .mode-row{display:flex;gap:8px;justify-content:center;margin:16px 0 8px}.mode-btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:99px;font-size:13px;font-weight:800}.mode-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}.source-row{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12px;margin:10px 0}.source-row select{border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:#fff;color:var(--ink);font-weight:700}
    .tag-group{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.edit-tags{border:0;background:transparent;color:var(--muted);padding:2px;font-size:15px}.tag-options{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tag-check{position:relative}.tag-check input{position:absolute;opacity:0}.tag-check span{display:block;border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-size:12px;font-weight:700}.tag-check input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}.tag-new{display:flex;gap:8px}.tag-new input{flex:1;border:1px solid var(--line);border-radius:7px;padding:10px}
    .manage-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:15px}.manage-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:10px 6px;font-size:13px;font-weight:800}.manage-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}#drawPhrase{min-height:24px;font-size:15px;font-weight:750;color:var(--red2)}
    .reset-btn{position:absolute;right:16px;top:16px;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink);font-size:22px;line-height:1}.reset-btn:hover{color:var(--red);border-color:var(--red)}
    .tag-library-title{font-size:12px;font-weight:800;color:var(--muted);margin:18px 0 7px}.tag-manage-list{max-height:180px;overflow:auto;border-top:1px solid var(--line)}.tag-manage-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:6px;padding:8px 2px;border-bottom:1px solid #eee9e2;font-size:13px;font-weight:700}.tag-manage-row button{border:0;background:transparent;padding:4px 6px;color:var(--muted)}.tag-manage-row button:hover{color:var(--red)}
    .tag-rename-input{min-width:0;width:100%;border:1px solid var(--red);border-radius:5px;padding:6px 8px;font-weight:700}.tag-manage-row.editing{grid-template-columns:1fr auto auto}.tag-manage-row .save-rename{color:var(--green)}
  </style>
</head>
<body>
  <div class="app">
    <main class="main">
      <header class="topbar"><div class="brand"><span class="mark">食</span><span>今天吃什么</span></div><button class="ghost" id="historyBtn">抽签记录</button></header>
      <section class="hero">
        <div class="eyebrow">交给运气，拒绝纠结</div>
        <h1>这一顿，吃什么？</h1>
        <div class="draw-box">
          <button class="reset-btn" id="resetBtn" title="重置本轮抽签" aria-label="重置本轮抽签">↻</button>
          <div class="mode-row"><button class="mode-btn active" data-mode="food">吃什么</button><button class="mode-btn" data-mode="buddy">找谁吃</button></div>
          <div class="source-row"><span>来源</span><select id="sourceSelect"><option value="全部">全部</option><option value="食堂">食堂</option><option value="外卖">外卖</option><option value="附近">附近</option><option value="私藏">私藏</option></select></div>
          <div class="result-label">今日签文</div>
          <div class="result" id="result">准备开饭</div>
          <div class="result-meta" id="resultMeta">当前有 <b id="poolCount">0</b> 个候选</div>
          <button class="draw-btn" id="drawBtn">开始抽签</button>
        </div>
        <div class="hint" id="drawPhrase"></div>
      </section>
    </main>
    <aside class="sidebar">
      <div class="manage-switch"><button class="manage-btn active" data-manage="food">我的菜单</button><button class="manage-btn" data-manage="buddy">我的饭搭子</button></div>
      <div class="side-title" id="listTitle">我的菜单 <span id="totalCount">0</span></div>
      <p class="side-desc" id="listDesc">选一个分类抽，或者把所有好吃的混在一起。</p>
      <div class="filters" id="filters"></div>
      <div class="food-list" id="foodList"></div>
      <form class="add" id="addForm"><input id="foodInput" maxlength="30" placeholder="加一道想吃的…" autocomplete="off"><button class="icon-btn" title="添加" aria-label="添加">+</button></form>
      <div class="side-actions"><button id="importBtn">批量导入</button><button id="clearBtn">清空菜单</button></div>
    </aside>
  </div>
  <div class="backdrop" id="importModal"><div class="modal"><div class="modal-head"><h2 id="importTitle">批量导入菜单</h2><button class="close" data-close="importModal" aria-label="关闭">×</button></div><p id="importDesc">每行一道美食，也支持逗号、顿号或分号。图片识别后会先回填文字，请确认无误再导入。</p><textarea id="importText" placeholder="麻辣烫&#10;番茄牛腩饭&#10;牛肉面&#10;轻食沙拉"></textarea><div class="modal-row"><select id="importCategory"><option>食堂</option><option>外卖</option><option>附近</option><option>私藏</option></select><button class="primary" id="confirmImport">导入菜单</button></div><label class="ghost" style="display:block;text-align:center;margin-top:10px;padding-top:10px">从截图/照片识别<input id="imageInput" type="file" accept="image/*" capture="environment" style="display:none"></label><div id="ocrStatus" style="font-size:12px;color:var(--muted);margin-top:8px;text-align:center"></div></div></div>
  <div class="backdrop" id="historyModal"><div class="modal"><div class="modal-head"><h2>抽签记录</h2><button class="close" data-close="historyModal" aria-label="关闭">×</button></div><div id="historyList"></div></div></div>
  <div class="backdrop" id="tagModal"><div class="modal"><div class="modal-head"><h2 id="tagModalTitle">编辑标签</h2><button class="close" data-close="tagModal" aria-label="关闭">×</button></div><p>一个项目可以选择多个标签。</p><div id="tagOptions" class="tag-options"></div><div class="tag-new"><input id="newTagInput" maxlength="12" placeholder="新标签名称"><button class="ghost" id="addTagBtn">添加标签</button></div><div class="tag-library-title">管理已有标签</div><div id="tagManageList" class="tag-manage-list"></div><button class="primary" id="saveTagsBtn" style="width:100%;margin-top:14px">保存标签</button></div></div>
  <div class="toast" id="toast"></div>
  <div class="backdrop" id="tipModal"><div class="modal" style="text-align:center;max-width:380px"><div style="font-size:34px;margin-bottom:8px">🍜</div><h2>小建议</h2><p style="font-size:15px;color:var(--ink);margin:12px 0 18px">连续三次都想重抽，说明你其实已经知道答案了。</p><button class="primary" data-close="tipModal">好，开饭！</button></div></div>
  <script>
    const KEY='today-eat-v2';
    const DEFAULT_STATE={
      foods:[
        ['红烧肉盖饭',['食堂']],['兰州牛肉面',['食堂']],['麻辣香锅',['食堂']],['番茄牛腩饭',['食堂']],
        ['黄焖鸡米饭',['外卖']],['韩式拌饭',['外卖']],['轻食沙拉',['外卖']],['寿司拼盘',['附近']],
        ['重庆小面',['附近']],['炭火烤肉',['私藏']],['比格披萨',['附近']],['豆腐脑',['东院']],
        ['大饼卷一切',['东院']],['海底捞',['附近']],['单人小火锅',['附近']],['铁锅炖',['东院']],
        ['铁板烧',['附近']],['烤串',['外卖']],['凉皮',['食堂']],['天津菜',['附近']],['烤盘饭',['食堂']],['玉米',['食堂']]
      ].map((x,i)=>({id:1000+i,name:x[0],tags:x[1]})),
      buddies:[
        ['小恒',['校内']],['小邵',['校外']],['小梦',['校外']],['小惠',['校外']],['小晴',['校内']],
        ['自己',['校内','私藏']],['小佳',['异地']],['小彤',['异地']],['小邓',['私藏']],['小张',['同门']],
        ['小朱',['校外']],['小刘',['校外']],['小琪',['异地']],['小羊',['校内','同门']]
      ].map((x,i)=>({id:2000+i,name:x[0],tags:x[1]})),
      foodTags:['食堂','外卖','附近','私藏','和TA','东院'],
      buddyTags:['校内','校外','异地','私藏','其他','同门'],
      history:[]
    };
    let state=load(),active='全部',manageActive='全部',rolling=false,mode='food',manageMode='food',drawCount=0,editingId=null,lastFood='',lastBuddy='';
    function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.foods))return v}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_STATE))}
    function save(){localStorage.setItem(KEY,JSON.stringify(state))}
    const $=s=>document.querySelector(s), esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    state.buddies=state.buddies||[];state.foodTags=state.foodTags||['食堂','外卖','附近','私藏'];state.buddyTags=state.buddyTags||['校内','校外','异地'];[...state.foods,...state.buddies].forEach(x=>{x.tags=x.tags||[x.category].filter(Boolean)});save();
    $('#importCategory').outerHTML='<input id="importCategory" placeholder="标签用逗号分隔，如：食堂, 私藏" style="border:1px solid var(--line);border-radius:7px;padding:0 10px">';
    function tagLibrary(kind=manageMode){return kind==='food'?state.foodTags:state.buddyTags}
    function pool(){const target=mode==='food'?state.foods:state.buddies;return target.filter(x=>active==='全部'||x.tags.includes(active))}
    function phrase(food=lastFood,buddy=lastBuddy){return food&&buddy?`今天和${buddy}吃${food}`:food?`今天吃${food}`:buddy?`今天找${buddy}吃`:''}
    function render(){
      const drawCats=['全部',...tagLibrary(mode)],manageCats=['全部',...tagLibrary(manageMode)];if(!drawCats.includes(active))active='全部';if(!manageCats.includes(manageActive))manageActive='全部';
      $('#filters').innerHTML=manageCats.map(c=>`<button class="chip ${c===manageActive?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')+'<button class="chip" id="newTagBtn">＋ 标签</button>';
      const data=manageMode==='food'?state.foods:state.buddies,rows=data.filter(x=>manageActive==='全部'||x.tags.includes(manageActive));$('#foodList').innerHTML=rows.length?rows.map(x=>`<div class="food"><span class="food-name">${esc(x.name)}</span><span class="food-right"><span class="tag-group">${x.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</span><button class="edit-tags" data-edit="${x.id}" title="编辑标签">✎</button><button class="del" data-id="${x.id}" aria-label="删除 ${esc(x.name)}">×</button></span></div>`).join(''):`<div class="empty">${manageMode==='food'?'这个分类还是空的，先加点好吃的吧。':'还没有饭搭子，先添加人名或昵称吧。'}</div>`;
      $('#listTitle').innerHTML=(manageMode==='food'?'我的菜单':'我的饭搭子')+' <span id="totalCount">'+data.length+'</span>';$('#listDesc').textContent=manageMode==='food'?'选一个分类抽，或者把所有好吃的混在一起。':'录入昵称，抽到谁就找谁一起吃。';
      $('#foodInput').placeholder=manageMode==='food'?'加一道想吃的…':'输入人名或昵称…';$('#clearBtn').textContent=manageMode==='food'?'清空菜单':'清空饭搭子';$('#sourceSelect').innerHTML=drawCats.map(c=>`<option>${esc(c)}</option>`).join('');$('#sourceSelect').value=active;
      const drawRows=pool();$('#poolCount').textContent=drawRows.length;$('#drawBtn').disabled=!drawRows.length;
    }
    function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}
    function addNames(text,tags){const names=text.split(/[\n,，、;；]+/).map(x=>x.trim()).filter(Boolean);tags=Array.isArray(tags)?tags:[tags].filter(Boolean);if(!tags.length)tags=[manageMode==='food'?'私藏':'未分类'];tags.forEach(t=>{if(!tagLibrary().includes(t))tagLibrary().push(t)});let n=0;const target=manageMode==='food'?state.foods:state.buddies;names.forEach(name=>{if(!target.some(x=>x.name.toLowerCase()===name.toLowerCase())){target.push({id:Date.now()+Math.random(),name:name.slice(0,30),tags:[...tags]});n++}});save();render();return n}
    function renderTagOptions(selected=[]){const tags=tagLibrary();$('#tagOptions').innerHTML=tags.map(t=>`<label class="tag-check"><input type="checkbox" value="${esc(t)}" ${selected.includes(t)?'checked':''}><span>${esc(t)}</span></label>`).join('');$('#tagManageList').innerHTML=tags.map(t=>`<div class="tag-manage-row"><span>${esc(t)}</span><button data-rename-tag="${esc(t)}" title="修改名称">修改</button><button data-delete-tag="${esc(t)}" title="删除标签">删除</button></div>`).join('')}
    function openTagEditor(id){editingId=id;const item=(manageMode==='food'?state.foods:state.buddies).find(x=>String(x.id)===String(id));$('#tagModalTitle').textContent=item?`编辑「${item.name}」的标签`:'新增自定义标签';renderTagOptions(item?item.tags:[]);$('#tagModal').classList.add('open')}
    $('#filters').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){manageActive=b.dataset.cat;render()}else if(e.target.closest('#newTagBtn'))openTagEditor(null)};
    $('#foodList').onclick=e=>{const edit=e.target.closest('[data-edit]');if(edit){openTagEditor(edit.dataset.edit);return}const b=e.target.closest('[data-id]');if(b){const target=manageMode==='food'?state.foods:state.buddies;if(manageMode==='buddy')state.buddies=target.filter(x=>String(x.id)!==b.dataset.id);else state.foods=target.filter(x=>String(x.id)!==b.dataset.id);save();render()}};
    $('#addForm').onsubmit=e=>{e.preventDefault();const input=$('#foodInput'),name=input.value.trim();if(!name)return;input.value='';const tags=[manageActive==='全部'?(manageMode==='food'?'私藏':'未分类'):manageActive];const n=addNames(name,tags);if(n)toast(manageMode==='food'?'已加入菜单':'已加入饭搭子');else toast(manageMode==='food'?'菜单里已经有它了':'饭搭子里已经有这个名字了')};
    $('#drawBtn').onclick=()=>{const items=pool();if(!items.length||rolling)return;drawCount++;rolling=true;const out=$('#result');out.classList.add('rolling');let ticks=0;const timer=setInterval(()=>{out.textContent=items[Math.floor(Math.random()*items.length)].name;if(++ticks>=18){clearInterval(timer);try{const pick=items[Math.floor(Math.random()*items.length)];out.textContent=pick.name;out.classList.remove('rolling');$('#resultMeta').innerHTML='抽到了，就不许反悔哦～';if(mode==='food')lastFood=pick.name;else lastBuddy=pick.name;$('#drawPhrase').textContent=phrase();state.history.unshift({name:pick.name,category:pick.tags[0]||'未分类',time:Date.now()});state.history=state.history.slice(0,20);save();if(drawCount===3)$('#tipModal').classList.add('open')}finally{rolling=false;$('#drawBtn').disabled=!pool().length;render()}}},75)};
    document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;manageMode=mode;active='全部';manageActive='全部';drawCount=0;$('#sourceSelect').value='全部';$('#result').textContent=mode==='food'?'准备开饭':'准备找搭子';$('#resultMeta').innerHTML='当前有 <b id="poolCount">0</b> 个候选';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-manage]').forEach(x=>x.classList.toggle('active',x.dataset.manage===manageMode));render()});
    $('#resetBtn').onclick=()=>{lastFood='';lastBuddy='';drawCount=0;rolling=false;$('#result').textContent=mode==='food'?'准备开饭':'准备找搭子';$('#resultMeta').innerHTML='当前有 <b id="poolCount">0</b> 个候选';$('#drawPhrase').textContent='';$('#tipModal').classList.remove('open');render();toast('已重置，可以开始新一轮')};
    document.querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>{manageMode=b.dataset.manage;manageActive='全部';document.querySelectorAll('[data-manage]').forEach(x=>x.classList.toggle('active',x===b));render()});
    $('#sourceSelect').onchange=e=>{active=e.target.value;render()};
    $('#importBtn').onclick=()=>{const buddy=manageMode==='buddy';$('#importTitle').textContent=buddy?'批量导入饭搭子':'批量导入菜单';$('#importDesc').textContent=buddy?'每行一个人名或昵称；下方可填写多个标签，用逗号分隔。':'每行一道美食；下方可填写多个标签，用逗号分隔。';$('#importText').placeholder=buddy?'小王\n阿杰\n产品小李\n隔壁老张':'麻辣烫\n番茄牛腩饭\n牛肉面\n轻食沙拉';$('#importCategory').value=manageActive==='全部'?'':manageActive;$('#importCategory').placeholder=buddy?'标签，如：校内, 同部门':'标签，如：食堂, 私藏';$('#confirmImport').textContent=buddy?'导入饭搭子':'导入菜单';$('#importModal').classList.add('open')};$('#historyBtn').onclick=()=>{const h=state.history;$('#historyList').innerHTML=h.length?h.map(x=>`<div class="food" style="margin-top:8px"><span><b>${esc(x.name)}</b><br><small style="color:var(--muted)">${new Date(x.time).toLocaleString('zh-CN')}</small></span><span class="tag">${esc(x.category)}</span></div>`).join(''):'<div class="empty" style="margin-top:16px">还没有抽过签。</div>';$('#historyModal').classList.add('open')};
    document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>$('#'+x.dataset.close).classList.remove('open'));document.querySelectorAll('.backdrop').forEach(x=>x.onclick=e=>{if(e.target===x)x.classList.remove('open')});
    $('#confirmImport').onclick=()=>{const tags=$('#importCategory').value.split(/[,，、;；]+/).map(x=>x.trim()).filter(Boolean);const n=addNames($('#importText').value,tags);$('#importText').value='';$('#importModal').classList.remove('open');toast(n?(manageMode==='buddy'?`成功导入 ${n} 位饭搭子`:`成功导入 ${n} 道美食`):'没有可导入的新内容')};
    $('#imageInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;const status=$('#ocrStatus');status.textContent='正在识别图片文字…';try{if(!window.Tesseract){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}const r=await Tesseract.recognize(file,'chi_sim+eng');$('#importText').value=r.data.text;status.textContent='识别完成，请检查文字后导入。'}catch(err){status.textContent='识别失败，请改用文字输入。'}};
    $('#addTagBtn').onclick=()=>{const input=$('#newTagInput'),tag=input.value.trim();if(!tag)return;if(!tagLibrary().includes(tag))tagLibrary().push(tag);input.value='';save();const item=editingId&&(manageMode==='food'?state.foods:state.buddies).find(x=>String(x.id)===String(editingId));renderTagOptions(item?item.tags:[]);toast('标签已添加')};
    $('#tagManageList').onclick=e=>{const rename=e.target.closest('[data-rename-tag]'),saveRename=e.target.closest('[data-save-rename]'),cancel=e.target.closest('[data-cancel-rename]'),del=e.target.closest('[data-delete-tag]'),library=tagLibrary(),items=manageMode==='food'?state.foods:state.buddies,selected=[...document.querySelectorAll('#tagOptions input:checked')].map(x=>x.value);if(rename){const old=rename.dataset.renameTag,row=rename.closest('.tag-manage-row');row.classList.add('editing');row.innerHTML=`<input class="tag-rename-input" maxlength="12" value="${esc(old)}" aria-label="新标签名称"><button class="save-rename" data-save-rename="${esc(old)}">保存</button><button data-cancel-rename>取消</button>`;const input=row.querySelector('input');input.focus();input.select();return}if(cancel){renderTagOptions(selected);return}if(saveRename){const old=saveRename.dataset.saveRename,next=saveRename.closest('.tag-manage-row').querySelector('input').value.trim();if(!next){toast('标签名称不能为空');return}if(next!==old&&library.includes(next)){toast('已经存在同名标签');return}if(next!==old){library[library.indexOf(old)]=next;items.forEach(x=>x.tags=x.tags.map(t=>t===old?next:t));if(manageActive===old)manageActive=next;if(mode===manageMode&&active===old)active=next;save();render();toast('标签名称已修改')}renderTagOptions(selected.map(t=>t===old?next:t));return}if(del){const old=del.dataset.deleteTag;if(confirm(`确定删除标签“${old}”吗？`)){library.splice(library.indexOf(old),1);items.forEach(x=>{x.tags=x.tags.filter(t=>t!==old);if(!x.tags.length)x.tags=['未分类']});if(items.some(x=>x.tags.includes('未分类'))&&!library.includes('未分类'))library.push('未分类');if(manageActive===old)manageActive='全部';if(mode===manageMode&&active===old)active='全部';save();renderTagOptions(selected.filter(t=>t!==old));render();toast('标签已删除')}}};
    $('#saveTagsBtn').onclick=()=>{const selected=[...document.querySelectorAll('#tagOptions input:checked')].map(x=>x.value);if(editingId){const item=(manageMode==='food'?state.foods:state.buddies).find(x=>String(x.id)===String(editingId));if(item)item.tags=selected.length?selected:['未分类'];if(!selected.length&&!tagLibrary().includes('未分类'))tagLibrary().push('未分类')}save();$('#tagModal').classList.remove('open');editingId=null;render();toast('标签已保存')};
    $('#clearBtn').onclick=()=>{const target=manageMode==='food'?state.foods:state.buddies;if(target.length&&confirm(manageMode==='food'?'确定清空全部菜单吗？抽签记录会保留。':'确定清空全部饭搭子吗？抽签记录会保留。')){if(manageMode==='food')state.foods=[];else state.buddies=[];save();render();toast(manageMode==='food'?'菜单已清空':'饭搭子已清空')}};
    render();
  </script>
</body>
</html>
